name: CI

# Not on every push. Runs:
#   - on demand:  Actions tab -> "CI" -> "Run workflow" (or `gh workflow run ci.yml`)
#   - once a day: only if something under scripts/ (or syncer.tmux / tests/)
#                 changed in the last 24h.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 22 * * *'   # 22:00 UTC daily (GitHub cron is UTC and may be delayed)

jobs:
  gate:
    name: Decide whether to run
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # full history so `git log` can look back
      - id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run requested."
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git log --since="24 hours ago" --pretty=%H -- scripts/ syncer.tmux tests/ | grep -q .; then
            echo "Relevant changes in the last 24h -> running."
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No changes under scripts/ in the last 24h -> skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: Lint (syntax + shellcheck)
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check (bash -n)
        run: |
          for f in syncer.tmux scripts/*.sh tests/*.sh; do
            echo "bash -n $f"
            bash -n "$f"
          done

      - name: ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          # SC1091: sourced files not followed; SC2154: vars come from sourced variables.sh
          shellcheck --severity=warning --exclude=SC1091,SC2154 \
            syncer.tmux scripts/*.sh tests/*.sh

  smoke:
    name: Smoke test (headless tmux)
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tmux
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux

      - name: tmux version
        run: tmux -V

      - name: Run smoke test
        run: bash tests/smoke.sh
